name: Build and publish installers

on:
  push:
    branches:
      - arena/39d6bf99-bt-clasic-contorol-app
  workflow_dispatch:
    inputs:
      release_version:
        description: "GitHub release tag to create (example: v1.1.0)"
        required: true
        default: v1.1.0
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          test -d "$ANDROID_HOME"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run android:sync
      - name: Build installable debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../android-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -Ei 'FAILURE: Build failed|What went wrong|Execution failed|Could not|error:|Exception|No such file|not found|SDK location|Namespace not specified|Unsupported class|Plugin with id|requires compileSdk|uses-sdk:minSdkVersion' ../android-build.log | head -n 20 >> "$GITHUB_STEP_SUMMARY" || true
            while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error title=Gradle diagnosis::$escaped"
            done < <(grep -Ei 'FAILURE: Build failed|What went wrong|Execution failed|Could not|error:|Exception|No such file|not found|SDK location|Namespace not specified|Unsupported class|Plugin with id|requires compileSdk|uses-sdk:minSdkVersion' ../android-build.log | head -n 20)
            exit "$build_status"
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amin-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amin-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 5

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run electron:dist 2>&1 | Tee-Object -FilePath electron-build.log
          $buildStatus = $LASTEXITCODE
          if ($buildStatus -ne 0) {
            Get-Content electron-build.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content electron-build.log | Select-String -Pattern '⨯|ERROR|failed|error|cannot|unable|not found|exception' | Select-Object -Last 25 | ForEach-Object { Write-Output "::error title=Electron diagnosis::$($_.Line)" }
            exit $buildStatus
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amin-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amin-windows-build-log
          path: electron-build.log
          if-no-files-found: ignore
          retention-days: 5

  github-release:
    name: Publish APK and Windows installer
    runs-on: ubuntu-latest
    needs: [android-apk, windows-installer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amin-android-apk
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: amin-windows-installer
          path: release-assets/windows
      - name: Prepare release files
        run: |
          mv release-assets/android/app-debug.apk release-assets/AMIN-Bluetooth-Control-Android.apk
          find release-assets/windows -maxdepth 1 -type f -name '*.exe' -exec mv {} release-assets/ \;
          test -s release-assets/AMIN-Bluetooth-Control-Android.apk
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
      - name: Create GitHub release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version || 'v1.1.0' }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must look like v1.1.0"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists; keeping published files unchanged."
            exit 0
          fi
          gh release create "$RELEASE_VERSION" release-assets/AMIN-Bluetooth-Control-Android.apk release-assets/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMIN Bluetooth Control $RELEASE_VERSION" \
            --notes "Installers for AMIN Bluetooth Control. Android APK is a debug-signed installable build. Windows installer is an unsigned x64 NSIS installer. HC-05/HC-06 use Bluetooth Classic SPP; pair the module in system settings first."
