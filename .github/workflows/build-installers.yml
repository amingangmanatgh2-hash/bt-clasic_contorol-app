name: Build and publish installers

on:
  push:
    branches:
      - arena/39d6bf99-bt-clasic-contorol-app
  workflow_dispatch:
    inputs:
      release_version:
        description: "GitHub release tag to create (example: v3.0.1)"
        required: true
        default: v3.0.1
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          command -v sdkmanager || true
          test -d "$ANDROID_HOME"
      - run: npm ci
      - run: npm run test:telemetry
      - run: npm run android:sync
      - name: Build installable debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          : > ../android-build.log
          build_status=1
          for attempt in 1 2 3; do
            echo "Android build attempt $attempt/3"
            set +e
            ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../android-build.log
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ] && grep -Eqi 'status code 429|HTTP 429|Too Many Requests' ../android-build.log; then
              echo "Maven Central rate limit detected; retrying after a short delay."
              sleep $((attempt * 15))
            else
              break
            fi
          done
          if [ "$build_status" -ne 0 ]; then
            grep -Ei 'FAILURE: Build failed|What went wrong|Execution failed|Could not|error:|Exception|No such file|not found|SDK location|Namespace not specified|Unsupported class|Plugin with id|requires compileSdk|uses-sdk:minSdkVersion' ../android-build.log | head -n 20 >> "$GITHUB_STEP_SUMMARY" || true
            while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error title=Gradle diagnosis::$escaped"
            done < <(grep -Ei 'FAILURE: Build failed|What went wrong|Execution failed|Could not|error:|Exception|No such file|not found|SDK location|Namespace not specified|Unsupported class|Plugin with id|requires compileSdk|uses-sdk:minSdkVersion' ../android-build.log | head -n 20)
            exit "$build_status"
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amin-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amin-android-build-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 5

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run test:telemetry
      - name: Build compact Tauri Windows installer with direct RFCOMM Bluetooth
        shell: pwsh
        run: |
          npm run desktop:build 2>&1 | Tee-Object -FilePath desktop-build.log
          $buildStatus = $LASTEXITCODE
          if ($buildStatus -ne 0) {
            Get-Content desktop-build.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content desktop-build.log | Select-String -Pattern 'error|failed|cannot|unable|not found|exception' | Select-Object -Last 25 | ForEach-Object { Write-Output "::error title=Tauri build diagnosis::$($_.Line)" }
            exit $buildStatus
          }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: amin-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amin-windows-build-log
          path: desktop-build.log
          if-no-files-found: ignore
          retention-days: 5

  github-release:
    name: Publish APK and Windows installer
    runs-on: ubuntu-latest
    needs: [android-apk, windows-installer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amin-android-apk
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: amin-windows-installer
          path: release-assets/windows
      - name: Prepare release files
        run: |
          mv release-assets/android/app-debug.apk release-assets/AMIN-Bluetooth-Control-Android.apk
          find release-assets/windows -maxdepth 1 -type f -name '*.exe' -exec mv {} release-assets/ \;
          test -s release-assets/AMIN-Bluetooth-Control-Android.apk
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
      - name: Create GitHub release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version || 'v3.0.1' }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must look like v3.0.1"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists; keeping published files unchanged."
            exit 0
          fi
          gh release create "$RELEASE_VERSION" release-assets/AMIN-Bluetooth-Control-Android.apk release-assets/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMIN Bluetooth Control $RELEASE_VERSION" \
            --notes "Installers for AMIN Bluetooth Control. Android APK is a debug-signed installable build. Windows installer is an unsigned x64 NSIS installer. Windows uses a compact Tauri/WebView2 desktop shell and connects directly to paired Bluetooth Classic RFCOMM/SPP devices (no COM-port selection); pair the module in system Bluetooth settings first. Android remains a Bluetooth Classic SPP app."
