name: Build and publish installers

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: GitHub release tag to create (example: v1.0.0)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run android:sync
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: amin-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run electron:dist
      - uses: actions/upload-artifact@v4
        with:
          name: amin-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish APK and Windows installer
    runs-on: ubuntu-latest
    needs: [android-apk, windows-installer]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: amin-android-apk
          path: release-assets/android
      - uses: actions/download-artifact@v4
        with:
          name: amin-windows-installer
          path: release-assets/windows
      - name: Prepare release files
        run: |
          mv release-assets/android/app-debug.apk release-assets/AMIN-Bluetooth-Control-Android.apk
          find release-assets/windows -maxdepth 1 -type f -name '*.exe' -exec mv {} release-assets/ \;
          test -s release-assets/AMIN-Bluetooth-Control-Android.apk
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
      - name: Create GitHub release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must look like v1.0.0"
            exit 1
          fi
          gh release create "$RELEASE_VERSION" release-assets/AMIN-Bluetooth-Control-Android.apk release-assets/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AMIN Bluetooth Control $RELEASE_VERSION" \
            --notes "Installers for AMIN Bluetooth Control. Android APK is a debug-signed installable build. Windows installer is an unsigned x64 NSIS installer. HC-05/HC-06 use Bluetooth Classic SPP; pair the module in system settings first."
