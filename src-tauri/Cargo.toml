[package]
name = "amin-bluetooth-control"
version = "3.0.1"
description = "AMIN Bluetooth Control desktop application"
authors = ["AMIN"]
edition = "2021"

[lib]
name = "amin_bluetooth_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Networking",
  "Networking_Sockets",
  "Storage_Streams"
] }
